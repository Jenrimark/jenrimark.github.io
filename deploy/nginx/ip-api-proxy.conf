# Nginx 反向代理 —— 放进 jenrimark.cn 的 server {}，位置要在 location / 之前
#
# 已于 2026-10-09 部署到 8.134.103.230（/etc/nginx/sites-enabled/jenrimark）
#
# 注意：反代源地址是服务器出口，必须用 $remote_addr 显式查访客 IP，
#       否则 IP-API 永远返回机房 IP。
#
# 验证：
#   curl -sS 'https://www.jenrimark.cn/proxy/ip-api/json/?lang=zh-CN&fields=query,city,isp'
#   # 期望 Content-Type: application/json，query 为访客公网 IP
#
# 生效：
#   nginx -t && systemctl reload nginx
#
# 说明：Google 联想已改为本地最近搜索，不再需要 /proxy/google-suggest/

# ---------- IP-API.com 免费版（仅 HTTP，靠本反代给 HTTPS 站用） ----------
# 前端：/proxy/ip-api/json/?lang=zh-CN&fields=...&callback=...
# 45 次/分钟，X-Rl / X-Ttl 限流头会透传给浏览器
location /proxy/ip-api/json/ {
    # /proxy/ip-api/json/ + query → http://ip-api.com/json/<访客IP>?fields=...
    proxy_pass http://ip-api.com/json/$remote_addr$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Host ip-api.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
