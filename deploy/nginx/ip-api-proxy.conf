# IP-API.com 免费版反向代理（给 HTTPS 站点用）
#
# 背景：免费版只有 http://ip-api.com，HTTPS 页面直连会被浏览器当混合内容拦截。
# 同源 /proxy/ip-api/ 由 Nginx 去 HTTP 拉接口，页面仍走 HTTPS。
#
# 用法（二选一）：
#   1) 把下面 location 放进 jenrimark.cn 的 server {}，与现有 /proxy/google-suggest/ 并列
#   2) 或 include 本文件（路径按你机器上的实际位置）
#
# 生效：nginx -t && nginx -s reload
# 验证：curl -sS 'https://www.jenrimark.cn/proxy/ip-api/json/?lang=zh-CN&fields=query,city,isp'
#
# 前端约定（view-widgets.ts）：
#   /proxy/ip-api/json/?lang=zh-CN&fields=...&callback=...
#   → http://ip-api.com/json/?lang=zh-CN&fields=...&callback=...

location /proxy/ip-api/ {
    # 末尾斜杠：/proxy/ip-api/json/ → /json/
    proxy_pass http://ip-api.com/;

    proxy_http_version 1.1;
    proxy_set_header Host ip-api.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # 免费版 45 次/分钟，上游会回 X-Rl / X-Ttl，默认透传给浏览器，前端据此冷却
    # 不缓存，避免把他人 IP 的结果带给下一位访客
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
