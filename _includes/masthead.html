<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me" data-zh="首页" data-en="Homepage">Homepage</a></li>
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ link.url }}" data-zh="{{ link.zh }}" data-en="{{ link.title }}"{% if link.zh_href %} data-zh-href="{{ link.zh_href }}" data-en-href="{{ link.en_href }}"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
    <div class="lang-switch">
      <a href="#" id="lang-toggle">EN</a>
    </div>
  </div>
</div>
